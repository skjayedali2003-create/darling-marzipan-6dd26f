<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Delegate Admin Verification</title>
<style>body{font-family:Arial;background:#f3f6fa;padding:20px}.card{max-width:520px;margin:30px auto;background:#fff;padding:25px;border-radius:16px;box-shadow:0 8px 30px #0001}input,button{width:100%;box-sizing:border-box;padding:13px;margin:7px 0;border-radius:10px;border:1px solid #ccd6e2}button{background:#173b75;color:#fff;font-weight:700;border:0}.reject{background:#b42318}.msg{margin-top:12px;padding:12px;border-radius:10px;background:#f5f7fa;white-space:pre-wrap}</style></head>
<body><div class="card"><h2>Delegate Payment Verification</h2><p>এই page শুধু admin ব্যবহারের জন্য।</p><input id="secret" type="password" placeholder="ADMIN_SECRET"><input id="id" placeholder="SF-2026-0001"><button onclick="act('verify')">VERIFY PAYMENT</button><button class="reject" onclick="act('reject')">REJECT</button><div id="msg" class="msg"></div></div>
<script>async function act(action){const secret=document.getElementById('secret').value.trim(),id=document.getElementById('id').value.trim(),msg=document.getElementById('msg');if(!secret||!id){msg.textContent='Secret এবং Delegate ID দিন।';return}msg.textContent='Processing…';try{const r=await fetch('/.netlify/functions/admin-verify',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+secret},body:JSON.stringify({delegateId:id,action})});const t=await r.text();let d;try{d=JSON.parse(t)}catch{d={raw:t}}msg.textContent=r.ok?('Status: '+d.status+'\nDelegate ID: '+d.delegateId+'\nPass: '+d.passUrl+'\nEmail sent: '+(d.delivery?.email?'YES':'NO')+'\nWhatsApp sent: '+(d.delivery?.whatsapp?'YES':'NO')):('Error '+r.status+': '+(d.error||t));}catch(e){msg.textContent='Network error: '+e.message}}</script></body></html>
